<header class="header">
  <div class="header-inner container">
    <!-- Brand / Name -->
    <a routerLink="/" class="brand" (click)="closeMobileMenu()">
      <span class="brand-name">Aklesh Ramola</span>
      <span class="brand-divider">/</span>
      <span class="brand-role">Software Developer</span>
    </a>

    <!-- Desktop Navigation Links -->
    <nav class="desktop-nav" aria-label="Primary navigation">
      <ul class="nav-list">
        <li>
          <a
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-link"
          >
            Home
          </a>
        </li>
        <li>
          <a
            routerLink="/experience"
            routerLinkActive="active"
            class="nav-link"
          >
            Experience
          </a>
        </li>
        <li>
          <a
            routerLink="/projects"
            routerLinkActive="active"
            class="nav-link"
          >
            Projects
          </a>
        </li>
        <li>
          <a
            routerLink="/contact"
            routerLinkActive="active"
            class="nav-link"
          >
            Contact
          </a>
        </li>
      </ul>
    </nav>

    <!-- Mobile Menu Trigger (Mobile only) -->
    <div class="header-actions">
      <button
        type="button"
        class="sidebar-menu-btn"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="isMobileMenuOpen()"
        aria-controls="sidebar-navigation"
        aria-label="Toggle navigation menu"
        title="Menu"
      >
        <span class="hamburger-bar" [class.is-open]="isMobileMenuOpen()"></span>
        <span class="sidebar-btn-label">Menu</span>
      </button>
    </div>
  </div>

  <!-- Slide-Out Sidebar Drawer (Desktop & Mobile) -->
  @if (isMobileMenuOpen()) {
    <div
      id="sidebar-navigation"
      class="mobile-drawer"
      role="dialog"
      aria-modal="true"
      aria-label="Sidebar Navigation"
    >
      <!-- Backdrop (Clicking anywhere outside closes the drawer) -->
      <div class="mobile-drawer-backdrop" (click)="closeMobileMenu()"></div>

      <!-- Drawer Content -->
      <div class="mobile-drawer-content">
        <!-- Drawer Header with Close Button -->
        <div class="mobile-drawer-header">
          <div class="drawer-header-left">
            <span class="live-dot"></span>
            <span class="mobile-drawer-title">Navigation & Profiles</span>
          </div>
          <button
            type="button"
            class="mobile-close-btn"
            (click)="closeMobileMenu()"
            aria-label="Close sidebar menu"
            title="Close menu"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <!-- Navigation Links -->
        <ul class="mobile-nav-list">
          <li>
            <a
              routerLink="/"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              class="mobile-nav-link"
              (click)="closeMobileMenu()"
            >
              <span class="nav-number">01.</span>
              <span class="nav-text">Home</span>
            </a>
          </li>
          <li>
            <a
              routerLink="/experience"
              routerLinkActive="active"
              class="mobile-nav-link"
              (click)="closeMobileMenu()"
            >
              <span class="nav-number">02.</span>
              <span class="nav-text">Experience</span>
            </a>
          </li>
          <li>
            <a
              routerLink="/projects"
              routerLinkActive="active"
              class="mobile-nav-link"
              (click)="closeMobileMenu()"
            >
              <span class="nav-number">03.</span>
              <span class="nav-text">Projects</span>
            </a>
          </li>
          <li>
            <a
              routerLink="/contact"
              routerLinkActive="active"
              class="mobile-nav-link"
              (click)="closeMobileMenu()"
            >
              <span class="nav-number">04.</span>
              <span class="nav-text">Contact</span>
            </a>
          </li>
        </ul>

        <!-- Direct Social Channels in Sidebar -->
        <div class="drawer-social-section">
          <span class="drawer-section-label">Connect & Profiles</span>
          <div class="drawer-social-list">
            <!-- GitHub -->
            <a
              href="https://github.com/Lufy-TheDevil"
              target="_blank"
              rel="noopener noreferrer"
              class="drawer-social-item"
              title="GitHub (Lufy-TheDevil)"
            >
              <div class="social-left">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="17"
                  height="17"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="social-icon"
                >
                  <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
                </svg>
                <span>GitHub</span>
              </div>
              <span class="drawer-handle">Lufy-TheDevil</span>
            </a>

            <!-- LinkedIn -->
            <a
              href="https://www.linkedin.com/in/aklesh-ramola-b2308b356"
              target="_blank"
              rel="noopener noreferrer"
              class="drawer-social-item"
              title="LinkedIn (Aklesh Ramola)"
            >
              <div class="social-left">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="17"
                  height="17"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="social-icon"
                >
                  <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
                  <rect x="2" y="9" width="4" height="12"></rect>
                  <circle cx="4" cy="4" r="2"></circle>
                </svg>
                <span>LinkedIn</span>
              </div>
              <span class="drawer-handle">aklesh-ramola</span>
            </a>

            <!-- Email (with copy) -->
            <button
              type="button"
              class="drawer-social-item copy-email-btn"
              (click)="copyEmail()"
              title="Copy Email"
            >
              <div class="social-left">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="17"
                  height="17"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="social-icon"
                >
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                  <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                <span>Email</span>
              </div>
              <span class="drawer-handle email-handle">
                {{ copiedEmail() ? '✓ Copied' : 'Copy' }}
              </span>
            </button>
          </div>
        </div>

        <div class="mobile-drawer-footer">
          <div class="mobile-meta">
            <span class="mobile-meta-label">Architecture</span>
            <span class="mobile-meta-value">ERP & Backend Systems</span>
          </div>
        </div>
      </div>
    </div>
  }
</header>
