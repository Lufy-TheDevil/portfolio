@if (isVisible()) {
  <button
    type="button"
    class="scroll-top-btn"
    (click)="scrollToTop()"
    aria-label="Scroll to top of page"
    title="Back to top"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="arrow-up-icon"
    >
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>
}
